version: '3.8'
services:
  app:
    build: .
    image: quizcraft-app:latest
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
    command: sh -c "composer install --no-interaction --prefer-dist --ignore-platform-reqs || composer update --no-interaction --prefer-dist --ignore-platform-reqs || true; php artisan key:generate --force || true; php artisan migrate --force || true; php artisan serve --host=0.0.0.0 --port=8000"
